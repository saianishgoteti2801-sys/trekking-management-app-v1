{% extends "base.html" %}

{% block title %}

Register

{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card register-card shadow">

            <div class="card-header bg-primary text-white">

                <h3 class="text-center">

                    User Registration

                </h3>

            </div>

            <div class="card-body">

                <form
                    method="POST"
                    action="{{ url_for('auth.register') }}">

                    <div class="mb-3">

                        <label class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Email Address

                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Phone Number

                        </label>

                        <input
                            type="tel"
                            name="phone_number"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            minlength="8"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Register As

                        </label>

                        <select
                            name="role"
                            class="form-select">

                            <option value="Trekker">

                                Trekker

                            </option>

                            <option value="Staff">

                                Trek Staff

                            </option>

                        </select>

                    </div>

                    <button
                        type="submit"
                        class="btn register-submit">

                        Create Account

                    </button>

                </form>

                <hr>

                <p class="text-center">

                    Already have an account?

                    <a href="{{ url_for('auth.login') }}">

                        Login Here

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
