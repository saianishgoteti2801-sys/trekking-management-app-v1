{% extends "base.html" %}

{% block title %}

Admin Analytics

{% endblock %}

{% block content %}

<h2 class="mb-4">

    Trek Management Analytics

</h2>


<div class="row mb-4">

    <div class="col-md-4">

        <div class="card shadow text-center p-3">

            <h5>Total Treks</h5>

            <h2>

                {{ total_treks }}

            </h2>

        </div>

    </div>


    <div class="col-md-4">

        <div class="card shadow text-center p-3">

            <h5>Total Bookings</h5>

            <h2>

                {{ total_bookings }}

            </h2>

        </div>

    </div>


    <div class="col-md-4">

        <div class="card shadow text-center p-3">

            <h5>Active Users</h5>

            <h2>

                {{ active_users }}

            </h2>

        </div>

    </div>

</div>


<div class="card shadow p-4">

    <h4>

        Bookings Per Trek

    </h4>

    <canvas id="trekBookingChart"></canvas>

</div>


<script>

const labels = JSON.parse('{{ trek_labels | tojson | safe }}');

const values = JSON.parse('{{ trek_booking_counts | tojson | safe }}');

new Chart(

    document.getElementById(
        "trekBookingChart"
    ),

    {

        type: "bar",

        data: {

            labels: labels,

            datasets: [

                {

                    label:
                        "Number of Bookings",

                    data: values

                }

            ]

        },

        options: {

            responsive: true,

            scales: {

                y: {

                    beginAtZero: true,

                    ticks: {

                        precision: 0

                    }

                }

            }

        }

    }

);

</script>

{% endblock %}
