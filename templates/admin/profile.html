{% extends "base.html" %}

{% block title %}
Admin Profile
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin Profile</h2>

        <a
            href="{{ url_for('admin.dashboard') }}"
            class="btn btn-secondary">
            Back to Dashboard
        </a>
    </div>

    <div class="card shadow-sm rounded-4">

        <div
            class="card-header"
            style="
                background-color: #6b7a1f;
                color: white;
                border-radius: 16px 16px 0 0;
            "
        >
            <h4 class="mb-0">Profile Information</h4>
        </div>

        <div class="card-body p-4">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            value="{{ user.full_name }}"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ user.email }}"
                            required
                        >
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Phone Number
                        </label>

                        <input
                            type="text"
                            name="phone_number"
                            class="form-control"
                            value="{{ user.phone_number or '' }}"
                            placeholder="Enter phone number"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Role
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ user.role }}"
                            readonly
                        >
                    </div>

                </div>

                <div class="mt-3">
                    <button
                        type="submit"
                        class="btn"
                        style="
                            background-color: #6b7a1f;
                            color: white;
                            border-radius: 10px;
                            padding: 10px 22px;
                        "
                    >
                        Save Changes
                    </button>

                    <a
                        href="{{ url_for('admin.dashboard') }}"
                        class="btn btn-secondary ms-2"
                    >
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
