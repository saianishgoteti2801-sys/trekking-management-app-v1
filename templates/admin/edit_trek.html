{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">
                        Edit Trek
                    </h3>
                </div>

                <div class="card-body">

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                        action="{{ url_for('admin.edit_trek', trek_id=trek.id) }}"
                    >

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Trek Name
                                </label>

                                <input
                                    type="text"
                                    name="trek_name"
                                    class="form-control"
                                    placeholder="e.g. Valley of Flowers Trek"
                                    value="{{ trek.trek_name }}"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Location
                                </label>

                                <input
                                    type="text"
                                    name="location"
                                    class="form-control"
                                    placeholder="e.g. Uttarakhand"
                                    value="{{ trek.location }}"
                                    required
                                >
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Difficulty
                                </label>

                                <select
                                    name="difficulty"
                                    class="form-select"
                                    required
                                >
                                    <option
                                        value="Easy"
                                        {% if trek.difficulty == "Easy" %}selected{% endif %}
                                    >
                                        Easy
                                    </option>

                                    <option
                                        value="Moderate"
                                        {% if trek.difficulty == "Moderate" %}selected{% endif %}
                                    >
                                        Moderate
                                    </option>

                                    <option
                                        value="Hard"
                                        {% if trek.difficulty == "Hard" %}selected{% endif %}
                                    >
                                        Hard
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Trek Duration (Days)
                                </label>

                                <input
                                    type="number"
                                    name="duration_days"
                                    class="form-control"
                                    min="1"
                                    value="{{ trek.duration_days }}"
                                    required
                                >
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Available Slots
                                </label>

                                <input
                                    type="number"
                                    name="available_slots"
                                    class="form-control"
                                    min="1"
                                    value="{{ trek.available_slots }}"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Price (₹)
                                </label>

                                <input
                                    type="number"
                                    step="0.01"
                                    name="price"
                                    class="form-control"
                                    min="0"
                                    value="{{ trek.price }}"
                                    required
                                >
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Start Date
                                </label>

                                <input
                                    type="date"
                                    name="start_date"
                                    class="form-control"
                                    value="{{ trek.start_date }}"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    End Date
                                </label>

                                <input
                                    type="date"
                                    name="end_date"
                                    class="form-control"
                                    value="{{ trek.end_date }}"
                                    required
                                >
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Trek Status
                                </label>

                                <select
                                    name="status"
                                    class="form-select"
                                    required
                                >
                                    <option
                                        value="Open"
                                        {% if trek.status == "Open" %}selected{% endif %}
                                    >
                                        Open
                                    </option>

                                    <option
                                        value="Closed"
                                        {% if trek.status == "Closed" %}selected{% endif %}
                                    >
                                        Closed
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    Assign Staff
                                </label>

                                <select
                                    name="assigned_staff"
                                    class="form-select"
                                    required
                                >
                                    <option value="" disabled
                                        {% if not trek.assigned_staff_id %}selected{% endif %}
                                    >
                                        Select Staff
                                    </option>

                                    {% for staff in staff_members %}
                                        <option
                                            value="{{ staff.id }}"
                                            {% if trek.assigned_staff_id == staff.id %}selected{% endif %}
                                        >
                                            {{ staff.full_name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                        </div>


                        <div class="row">

                            <div class="col-md-12 mb-3">

                                <label class="form-label">
                                    Trek Brochure (PDF)
                                </label>

                                {% if trek.brochure_filename %}
                                    <div class="mb-2">
                                        <a
                                            href="{{ url_for('admin.download_brochure', trek_id=trek.id) }}"
                                            class="btn btn-info btn-sm">
                                            Download Current Brochure
                                        </a>
                                    </div>
                                {% endif %}

                                <input
                                    type="file"
                                    name="brochure"
                                    class="form-control"
                                    accept=".pdf,application/pdf">

                                <div class="form-text">
                                    Leave empty to keep the existing brochure.
                                </div>

                            </div>

                        </div>
                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('admin.manage_treks') }}"
                                class="btn btn-secondary"
                            >
                                Back
                            </a>

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Update Trek
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
