{% extends "base.html" %}

{% block title %}

Create Trek

{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="create-trek-card shadow">

                <div class="card-header bg-success text-white">

                    <h3>

                        Create New Trek

                    </h3>

                </div>

                <div class="card-body">

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                        action="{{ url_for('admin.create_trek') }}">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Trek Name

                                </label>

                                <input
                                    type="text"
                                    name="trek_name"
                                    class="form-control"
                                    placeholder="e.g. Valley of Flowers Trek"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Location

                                </label>

                                <input
                                    type="text"
                                    name="location"
                                    class="form-control"
                                    placeholder="e.g. Uttarakhand"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Difficulty

                                </label>

                                <select
                                    name="difficulty"
                                    class="form-select"
                                    required>

                                    <option value="Easy">

                                        Easy

                                    </option>

                                    <option value="Moderate">

                                        Moderate

                                    </option>

                                    <option value="Hard">

                                        Hard

                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Trek Duration (Days)

                                </label>

                                <input
                                    type="number"
                                    name="duration_days"
                                    class="form-control"
                                    min="1"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Available Slots

                                </label>

                                <input
                                    type="number"
                                    name="available_slots"
                                    class="form-control"
                                    min="1"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Price (₹)

                                </label>

                                <input
                                    type="number"
                                    step="0.01"
                                    name="price"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Start Date

                                </label>

                                <input
                                    type="date"
                                    name="start_date"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    End Date

                                </label>

                                <input
                                    type="date"
                                    name="end_date"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Trek Status

                                </label>

                                <select
                                    name="status"
                                    class="form-select"
                                    required>

                                    <option value="Open">

                                        Open

                                    </option>

                                    <option value="Closed">

                                        Closed

                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Assign Staff

                                </label>

                                <select
                                    name="assigned_staff"
                                    class="form-select"
                                    required>

                                    {% for staff in staff_members %}

                                    <option value="{{ staff.id }}">

                                        {{ staff.full_name }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                        </div>


                        <div class="row">

                            <div class="col-md-12 mb-3">

                                <label class="form-label">
                                    Trek Brochure (PDF)
                                </label>

                                <input
                                    type="file"
                                    name="brochure"
                                    class="form-control"
                                    accept=".pdf,application/pdf">

                                <div class="form-text">
                                    Upload the brochure for this trek in PDF format.
                                </div>

                            </div>

                        </div>
                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('admin.manage_treks') }}"
                                class="btn btn-secondary">

                                Back

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                Save Trek

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
