{% extends "base.html" %}

{% block title %}
Staff Settings
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Staff Settings
        </h2>

        <a
            href="{{ url_for('staff.dashboard') }}"
            class="btn btn-secondary">

            Back to Dashboard

        </a>

    </div>

    <div class="card shadow rounded-4">

        <div
            class="card-header text-white"
            style="
                background-color: #6b7a1f;
                border-radius: 16px 16px 0 0;
            "
        >

            <h4 class="mb-0">
                Change Password
            </h4>

        </div>

        <div class="card-body p-4">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Current Password
                    </label>

                    <input
                        type="password"
                        name="current_password"
                        class="form-control"
                        placeholder="Enter current password"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        New Password
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        class="form-control"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Re-enter new password"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn"
                    style="
                        background-color: #6b7a1f;
                        color: white;
                        border-radius: 10px;
                    "
                >
                    Change Password
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
