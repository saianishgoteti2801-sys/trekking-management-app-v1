{% extends "base.html" %}

{% block title %}

Staff Analytics

{% endblock %}

{% block content %}

<h2 class="mb-4">

    My Trek Participants

</h2>


<div class="card shadow p-4">

    <canvas id="participantChart"></canvas>

</div>


<script>

const labels = JSON.parse('{{ trek_labels | tojson | safe }}');

const values = JSON.parse('{{ participant_counts | tojson | safe }}');


new Chart(

    document.getElementById(
        "participantChart"
    ),

    {

        type: "bar",

        data: {

            labels: labels,

            datasets: [

                {

                    label:
                        "Participants",

                    data: values

                }

            ]

        },

        options: {

            responsive: true,

            scales: {

                y: {

                    beginAtZero: true,

                    ticks: {

                        precision: 0

                    }

                }

            }

        }

    }

);

</script>

{% endblock %}
